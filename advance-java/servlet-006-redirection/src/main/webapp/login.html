<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login Form</title>
</head>
<body>
<h2>Login Form</h2>
<form action="login" method="post">
    <table>
        <tr>
            <td>username</td>
            <td><input type="text" name="username" required/></td>
        </tr>
        <tr>
            <td>password</td>
            <td><input type="password" name="password" required/></td>
        </tr>
        <tr>
            <td><input type="submit" value="login"/></td>
        </tr>
    </table>
</form>

</body>
</html>
